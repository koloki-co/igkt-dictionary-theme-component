en:
  theme_metadata:
    description: "A multilingual dictionary at /dictionary. Entries come from a forum topic or a configured URL."
    settings:
      show_header_link: "Show a Dictionary icon in the site header. On the dictionary page it becomes a Back to forum arrow."
      header_link_title: "Tooltip and accessible name for the header Dictionary icon."
      page_title: "Optional page title. Leave blank to use the built-in title."
      page_subtitle: "Optional subtitle under the title."
      default_from_language: "Initial From language code, such as ja. Leave blank to use the first displayed language."
      language_order: "Optional list of language codes in display order, such as ja, en, pt-BR. Only listed languages are shown. Leave blank to use the languages found in the data."
      language_labels: "Optional language labels, such as ja=日本語|en=English. Separate entries with |."
      hidden_note_prefixes: "Optional prefixes for notes to hide, separated by |. This changes the dictionary display only; the source data remains readable."
      data_topic_id: "Numeric id of the public forum topic that holds the word list (preferred). The component fetches /t/{id}.json and /raw/{id}/{post_number}. Leave blank only if data_url is set."
      data_url: "Optional fallback URL to a JSON array or a dictionary document. Used when the topic is unset or cannot be loaded."
      sources_note: "Optional footer for credits and licence terms. Allowed HTML: p, a, strong, em and br. Use HTTP(S) or same-site links."
