en:
  theme_metadata:
    description: "A multilingual knot, ropework and tools dictionary at /dictionary, with search across English, Swedish, German, Finnish, French and Spanish. The word list is loaded from a forum topic, not bundled in the component."
    settings:
      show_header_link: "Show a Dictionary icon in the site header. On the dictionary page it becomes a Back to forum arrow."
      header_link_title: "Tooltip and accessible name for the header Dictionary icon."
      page_title: "Optional page title. Leave blank to use the built-in title."
      page_subtitle: "Optional subtitle under the title. Leave blank to use the built-in subtitle."
      default_from_language: "Default source language for the From selector when the page is opened."
      data_topic_id: "Numeric id of the public forum topic that holds the word list (preferred). The component fetches /t/{id}.json and /raw/{id}/{post_number}. Leave blank only if data_url is set."
      data_url: "Optional fallback URL to a JSON array or an igkt-dictionary document. Used when data_topic_id is empty, or if the topic cannot be read. A same-origin path is safest; a CDN/S3 URL may fail CORS."
      sources_note: "Footer credit shown at the bottom of the dictionary. Only the tags p, a, strong, em and br are kept; other markup is removed. Links must be http(s) or a same-site path starting with one slash. Keep the Virittäjä credit; it is a condition of their written permission, including for Finnish terms still to be added."
  title: "IGKT Multilingual Knot Dictionary"
